  #   description: "achievement-my-custom-desc"   # messages_*.yml 中的 key
  #   type: "TOTAL_CRAFTS"                         # 见上面的类型
  #   target: "250"                                # 见上面的 target 格式
  #   tier: "gold"                                 # bronze/silver/gold/diamond/none
