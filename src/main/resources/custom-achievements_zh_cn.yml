# ============================================================
# PhoenixCraft — 自定义成就 (中文版)
# ============================================================
# 此文件供服务器管理员添加自定义成就，
# 无需修改主 config.yml。
#
# 此处定义的成就会与 config.yml 中的合并。
# 如果同一成就 ID 在两个文件中都存在，此文件优先。
#
# 如何添加自定义成就：
# ============================================================
# 1. 复制下面的模板，粘贴到 "list:" 下
# 2. 修改 ID（如把 "my-achievement" 改成你自己的唯一名称）
# 3. 设置 type、target、tier 和奖励
# 4. 在 messages_zh_cn.yml / messages_en.yml 中添加名称和描述：
#      achievement-my-achievement-name: "我的成就名称"
#      achievement-my-achievement-desc: "做一些酷炫的事。"
# 5. 运行 /pcraft reload
#
# 成就类型：
#   FIRST_CRAFT       — 玩家第一次制作时解锁（无 target）
#   TOTAL_CRAFTS      — target = 整数（需要的总制作次数）
#   UNIQUE_RECIPES    — target = 整数（制作的不同配方数）
#   BULK_CRAFT        — target = 整数（一次批量制作 N+ 个）
#   RECIPE_CRAFTED    — target = 配方 id（制作此配方一次）
#   PER_RECIPE_COUNT  — target = "配方id:次数"（制作某配方 N 次）
#   CATEGORY_CRAFTS   — target = "类别:次数"（如 "rod:50"）
#   TOTAL_XP_EARNED   — target = 整数（从制作获得的总 XP）
#   FIRST_DISCOVERY   — target = 整数（发现 N 个不同配方）
#
# 阶级：
#   bronze, silver, gold, diamond, 或 none
#   （纯视觉 — 仅改变成就 GUI 中显示的前缀）
#
# 奖励：
#   reward-commands — 解锁时运行的 console 命令（用 %player% 占位）
#   reward-items    — 解锁时给予玩家的实体物品
# ============================================================

list:
