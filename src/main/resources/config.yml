# ============================================================
# PhoenixCraft — Configuration
# ============================================================
# Every aspect of PhoenixCraft is configurable here. After editing,
# run /pcraft reload to apply changes without restarting the server.
#
# All player-facing text comes from messages_en.yml / messages_tr.yml
# (selected by settings.language below).
# ============================================================

# ============================================================
# General Settings
# ============================================================
settings:
  # GUI language. Loads messages_<lang>.yml.
  # Valid values: "tr" or "en"
  language: "en"

  # Minimum milliseconds between two craft actions for the same player.
  # Prevents race conditions from rapid clicking.
  # 150 = 0.15 seconds (default)
  craft-cooldown-ms: 150

  # Maximum items producible in a single bulk craft.
  # Protects against integer overflow and lag.
  bulk-craft-cap: 1000

# ============================================================
# Sound System
# ============================================================
# Use valid Bukkit Sound enum names. Invalid names fall back to the
# default sound (with a console warning).
sounds:
  # Played on a successful craft
  craft-success: "BLOCK_ANVIL_USE"
  # Played on a failed craft (level/materials)
  craft-fail: "ENTITY_VILLAGER_NO"
  # Main level-up sound
  level-up: "ENTITY_PLAYER_LEVELUP"
  # Bonus chime for milestone levels (level >= 10)
  level-up-milestone: "UI_TOAST_CHALLENGE_COMPLETE"
  # Bonus sound for bulk crafts producing 10+ items
  bulk-craft-bonus: "UI_TOAST_CHALLENGE_COMPLETE"

# ============================================================
# Tier-Based Sounds
# ============================================================
# Sound is selected by the result item's custom-model-data.
# If no match, falls back to sounds.craft-success.
#
# custom-model-data 20001-20008 = rods (Hardwood → Cosmic)
# custom-model-data 40001-40013 = baits
tier-sounds:
  20001: "BLOCK_ANVIL_USE"             # Hardwood Rod
  20002: "BLOCK_ANVIL_USE"             # Iron Rod
  20003: "BLOCK_ANVIL_USE"             # Gold Rod
  20004: "BLOCK_AMETHYST_BLOCK_CHIME"  # Diamond Rod
  20005: "BLOCK_ANVIL_USE"             # Netherite Rod
  20006: "BLOCK_CONDUIT_ACTIVATE"      # Ocean's Wrath
  20007: "UI_TOAST_CHALLENGE_COMPLETE" # Legendary Rod
  20008: "UI_TOAST_CHALLENGE_COMPLETE" # Cosmic Rod

# ============================================================
# Particle Effects
# ============================================================
# Played on the player when a craft succeeds.
particles:
  # Enable or disable all particle effects
  enabled: true
  # Bukkit Particle enum name
  success-particle: "HAPPY_VILLAGER"
  # Base number of particles to spawn
  success-count: 5
  # Spread radius (in blocks)
  success-radius: 0.5
  # Extra particles per crafted item in bulk crafts
  # 0.2 = 1 extra particle per 5 items crafted
  bulk-multiplier: 0.2

# ============================================================
# GUI Appearance
# ============================================================
gui:
  # Border pane materials
  main-menu-border: "GRAY_STAINED_GLASS_PANE"
  category-border: "BLACK_STAINED_GLASS_PANE"
  detail-border: "GRAY_STAINED_GLASS_PANE"

  # Button materials
  buttons:
    craft-ready: "LIME_CONCRETE"
    craft-ready-close: "GREEN_CONCRETE"
    craft-disabled: "RED_CONCRETE"
    craft-max: "YELLOW_CONCRETE"
    next-page: "ARROW"
    prev-page: "ARROW"
    back: "ARROW"
    close: "BARRIER"
    info: "CRAFTING_TABLE"
    empty-category: "BARRIER"
    stats: "BOOK"
    achievements: "GOLDEN_APPLE"
    achievement-locked: "GRAY_DYE"
    achievement-unlocked: "GOLD_INGOT"
    # Faz 0.4.0: search + filter + sort buttons
    search: "COMPASS"
    filter-all: "HOPPER"
    filter-craftable: "LIME_DYE"
    filter-locked: "RED_DYE"
    sort-id: "PAPER"
    sort-level: "EXPERIENCE_BOTTLE"
    sort-xp: "GOLD_INGOT"
    sort-tier: "DIAMOND"
    # Faz 0.5.0: recipe + economy buttons
    recipes: "WRITTEN_BOOK"
    recipe-locked: "WRITTEN_BOOK"
    recipe-learned: "KNOWLEDGE_BOOK"
    sell-all: "GOLD_BLOCK"

  # Category icons (shown on the main menu)
  category-icons:
    rods: "FISHING_ROD"
    baits: "STICK"

# ============================================================
# Pagination
# ============================================================
pagination:
  # Recipes per page in category menus
  items-per-page: 45

# ============================================================
# Search System (Faz 0.4.0)
# ============================================================
# Players can search recipes by name or id via /pcraft search <query>
# or by typing in chat after clicking the search button.
search:
  # Enable or disable the search feature
  enabled: true
  # Maximum number of results to show in the search menu
  max-results: 45
  # Timeout in seconds for chat-based search input
  # (after clicking the search button, player has this long to type)
  chat-input-timeout-seconds: 30
  # Minimum query length (shorter queries are rejected)
  min-query-length: 2

# ============================================================
# Filter System (Faz 0.4.0)
# ============================================================
# In category menus, players can filter recipes by craftability.
filters:
  # Enable filter buttons in category menus
  enabled: true
  # Available filter modes (cycled by clicking the filter button)
  # ALL = show all recipes
  # CRAFTABLE = only recipes the player can craft right now
  # LOCKED = only recipes the player cannot craft (level or materials)
  modes:
    - "ALL"
    - "CRAFTABLE"
    - "LOCKED"

# ============================================================
# Sort System (Faz 0.4.0)
# ============================================================
# In category menus, players can sort recipes by different criteria.
sort:
  # Enable sort buttons in category menus
  enabled: true
  # Available sort modes (cycled by clicking the sort button)
  # ID = alphabetical by recipe id
  # LEVEL = by crafting level requirement (ascending)
  # XP = by XP reward (descending — biggest first)
  # TIER = by result item's custom-model-data (ascending)
  modes:
    - "ID"
    - "LEVEL"
    - "XP"
    - "TIER"

# ============================================================
# Economy System (Faz 0.5.0)
# ============================================================
# Crafting fees are deducted from the player's PhoenixFish balance.
# Set a recipe's fee in custom_recipes.yml via the `crafting-fee` field.
# Recipes without a `crafting-fee` field are free to craft.
economy:
  # Enable or disable crafting fees
  enabled: false
  # Default fee if a recipe has no explicit `crafting-fee` field
  # 0 = free, 100 = $100 per craft, etc.
  default-fee: 0
  # Charge the fee per item in bulk crafts
  # true  = fee × craftedCount
  # false = flat fee per bulk craft
  charge-per-item-in-bulk: true

# ============================================================
# Recipe Sharing System (Faz 0.5.0 / 0.6.0)
# ============================================================
# This is the CORE recipe-learning system. When enabled, players must
# "learn" recipes before they can craft them. Recipes are learned via:
#
#   1. Admin command: /pcraft giverecipe <player> <recipe-id>
#   2. Recipe book items (right-click to learn — see below)
#   3. Recipe rental (temporary — see recipe-rental section)
#   4. Black market (random — see blackmarket section)
#
# HOW IT WORKS:
# ┌──────────────────────────────────────────────────────────────┐
# │ Player tries to craft "cosmic_rod"                          │
# │    ↓                                                         │
# │ RecipeManager.hasLearned(uuid, "cosmic_rod")?               │
# │    ├─ YES → allow craft                                     │
# │    └─ NO  → "You haven't learned this recipe yet"           │
# │                                                              │
# │ Player gets a recipe book → right-clicks it                 │
# │    ↓                                                         │
# │ RecipeManager.learnRecipe(uuid, "cosmic_rod")               │
# │    → saved to learned_recipes.yml                           │
# │    → book consumed                                          │
# │    → "✔ Learned recipe: Cosmic Rod!"                        │
# └──────────────────────────────────────────────────────────────┘
#
# MODES:
#   enabled: false                → ALL recipes available to everyone (legacy)
#   enabled: true, require-learning: false  → learning is tracked but OPTIONAL
#   enabled: true, require-learning: true   → MUST learn before crafting
# ============================================================
recipe-sharing:
  # ─── Master Switch ───
  # false = entire system disabled, all recipes available to everyone
  # true  = learning system active (see require-learning below)
  enabled: false

  # ─── Learning Requirement ───
  # Only matters when 'enabled' is true.
  # false = players CAN craft unlearned recipes (learning is cosmetic/tracked only)
  # true  = players CANNOT craft unlearned recipes (must learn first)
  require-learning: false

  # ─── Recipe Book Item ───
  # The physical item that teaches a recipe when right-clicked.
  # The recipe ID is stored in the item's PersistentDataContainer (PDC),
  # so it survives server restarts and is unique per book.
  book:
    # Bukkit Material for the book item.
    # Common choices: WRITTEN_BOOK, KNOWLEDGE_BOOK, ENCHANTED_BOOK, BOOK
    material: "WRITTEN_BOOK"

    # Custom model data for resource pack support.
    # 0 = no custom model (uses vanilla texture)
    # Set to a number (e.g. 30001) if you have a resource pack
    custom-model-data: 0

    # Display name format.
    # Placeholders:
    #   %recipe%     = the recipe's result item display name (e.g. "Cosmic Rod")
    #   %recipe_id%  = the recipe's internal ID (e.g. "cosmic_rod")
    name-format: "<gold>Recipe Book: <white>%recipe%"

    # Lore lines shown on the book item.
    # Same placeholders as name-format.
    # Each line is a separate list entry.
    lore:
      - "<gray>Right-click to learn this recipe."
      - "<dark_gray>Recipe ID: <white>%recipe_id%"
      - ""
      - "<yellow>This book is consumed on use."

# ============================================================
# Recipe Book Crafting (Faz 0.6.0)
# ============================================================
# Allows players to CRAFT recipe books themselves, instead of only
# getting them from admins. Each recipe book has its own crafting
# recipe defined here.
#
# HOW IT WORKS:
# ┌──────────────────────────────────────────────────────────────┐
# │ Player has the materials for a recipe book                   │
# │    ↓                                                         │
# │ /pcraft craftbook <recipe-id>                                │
# │    ↓                                                         │
# │ PhoenixCraft checks the book recipe config                   │
# │    ├─ Materials match? → consume + give recipe book          │
# │    └─ Materials missing? → "Missing materials" error         │
# │                                                              │
# │ Player now has a recipe book item                            │
# │    → can right-click to learn (see recipe-sharing)           │
# │    → or trade/sell to other players                          │
# └──────────────────────────────────────────────────────────────┘
#
# To add a new craftable book, add an entry under 'recipes' below.
# The key must match a recipe ID from PhoenixFish's custom_recipes.yml.
# ============================================================
recipe-book-crafting:
  # ─── Master Switch ───
  # false = players cannot craft recipe books (only admins can give them)
  # true  = players can craft recipe books via /pcraft craftbook <id>
  enabled: false

  # ─── Crafting Level Requirement ───
  # Minimum crafting level required to craft ANY recipe book.
  # 0 = no level requirement
  # 10 = must be crafting level 10+
  crafting-level-requirement: 0

  # ─── Book Recipes ───
  # Each entry defines the materials needed to craft a recipe book
  # for a specific recipe. The key must match a recipe ID from
  # PhoenixFish's custom_recipes.yml (e.g. "worm", "hardwood_rod").
  #
  # Format:
  #   <recipe-id>:
  #     materials:          # list of required materials
  #       - material: PAPER      # Bukkit Material name
  #         amount: 3            # how many of this material
  #       - material: INK_SAC
  #         amount: 1
  #     # Optional: require the player to have already learned this recipe
  #     # before they can craft its book (for sharing with others)
  #     require-learned: false
  recipes:
    # Example: Craft a "worm" recipe book
    worm:
      materials:
        - material: PAPER
          amount: 3
        - material: INK_SAC
          amount: 1
      require-learned: false

    # Example: Craft a "hardwood_rod" recipe book
    hardwood_rod:
      materials:
        - material: PAPER
          amount: 5
        - material: INK_SAC
          amount: 1
        - material: STICK
          amount: 2
      require-learned: true  # must know hardwood_rod before crafting its book

    # Example: Craft a "cosmic_rod" recipe book (expensive)
    cosmic_rod:
      materials:
        - material: PAPER
          amount: 8
        - material: INK_SAC
          amount: 1
        - material: NETHERITE_INGOT
          amount: 1
      require-learned: true

# ============================================================
# Recipe Rental System (Faz 0.6.0)
# ============================================================
# Allows players to RENT recipes from other players for a limited time.
# The renter pays a fee (from PhoenixFish balance) and gains temporary
# access to the recipe. When the rental expires, the recipe is locked again.
#
# HOW IT WORKS:
# ┌──────────────────────────────────────────────────────────────┐
# │ Player A has learned "cosmic_rod" permanently                │
# │    ↓                                                         │
# │ /pcraft rent offer <recipe-id> <price> <minutes>             │
# │    → creates a rental offer                                  │
# │    → other players can see it via /pcraft rent list          │
# │                                                              │
# │ Player B: /pcraft rent accept <player-a> <recipe-id>         │
# │    → pays the price from PhoenixFish balance                 │
# │    → gains temporary access to cosmic_rod                    │
# │    → price transferred to Player A                           │
# │                                                              │
# │ After <minutes> minutes:                                     │
# │    → Player B loses access to cosmic_rod                     │
# │    → Player A can offer it again                             │
# └──────────────────────────────────────────────────────────────┘
#
# IMPORTANT: Recipe rental requires recipe-sharing to be enabled
# (recipe-sharing.enabled: true) and require-learning: true.
# Otherwise rental has no effect (everyone can craft everything).
# ============================================================
recipe-rental:
  # ─── Master Switch ───
  # false = rental system disabled
  # true  = players can offer and accept recipe rentals
  enabled: false

  # ─── Duration Limits ───
  # Maximum rental duration in minutes.
  # A player cannot offer a rental longer than this.
  # 0 = no limit (not recommended — rentals should expire)
  max-duration-minutes: 60

  # Minimum rental duration in minutes.
  # Prevents 1-minute "troll" rentals.
  min-duration-minutes: 5

  # ─── Price Limits ───
  # All prices are in PhoenixFish balance (not Vault).
  # Minimum price a player can charge for a rental.
  # 0 = free rentals allowed
  min-price: 10

  # Maximum price a player can charge.
  # 0 = no limit
  max-price: 0

  # ─── Transaction Fee ───
  # A percentage of the rental price that goes to the server (deleted).
  # 0 = no fee (renter pays full price to owner)
  # 10 = 10% server fee (renter pays 100, owner gets 90, 10 deleted)
  # 50 = 50% server fee (renter pays 100, owner gets 50, 50 deleted)
  transaction-fee-percent: 0

  # ─── Max Active Rentals ───
  # How many recipes a player can rent simultaneously.
  # 0 = no limit
  max-active-rentals-per-player: 5

  # ─── Max Offers ───
  # How many rental offers a player can have active simultaneously.
  # 0 = no limit
  max-offers-per-player: 10

# ============================================================
# Discovery System (Faz 0.6.0)
# ============================================================
# Awards bonus XP when a player crafts a recipe for the FIRST time.
# This encourages players to try different recipes instead of
# spamming the same one.
#
# HOW IT WORKS:
# ┌──────────────────────────────────────────────────────────────┐
# │ Player crafts "hardwood_rod" for the first time ever         │
# │    ↓                                                         │
# │ DiscoveryManager.isFirstCraft(uuid, "hardwood_rod")?         │
# │    ├─ YES → award bonus XP + "First Discovery!" message      │
# │    │       mark as discovered (discovered_recipes.yml)        │
# │    └─ NO  → no bonus (already discovered)                    │
# └──────────────────────────────────────────────────────────────┘
#
# The bonus XP is IN ADDITION to the recipe's normal XP reward.
# Example: hardwood_rod gives +5 XP normally, +20 bonus on first
# craft = 25 XP total for the first craft, 5 XP for subsequent crafts.
# ============================================================
discovery:
  # ─── Master Switch ───
  # false = no discovery bonuses (all crafts give normal XP)
  # true  = first craft of each recipe gives bonus XP
  enabled: true

  # ─── Bonus XP Calculation ───
  # The bonus XP is calculated as: recipe_xp_reward × multiplier
  # Example: multiplier 4.0, recipe gives 5 XP → bonus = 20 XP
  # Example: multiplier 2.0, recipe gives 100 XP → bonus = 200 XP
  bonus-xp-multiplier: 4.0

  # ─── Minimum Bonus XP ───
  # The bonus XP will never be less than this value.
  # Ensures even cheap recipes give a meaningful discovery bonus.
  # 0 = no minimum (bonus = recipe_xp × multiplier, even if 0)
  min-bonus-xp: 10

  # ─── Maximum Bonus XP ───
  # The bonus XP will never exceed this value.
  # Prevents extremely expensive recipes from giving absurd bonuses.
  # 0 = no maximum
  max-bonus-xp: 500

  # ─── Discovery Notification ───
  # Show a title on the player's screen when they discover a recipe.
  show-title: true

  # Sound played on discovery (Bukkit Sound enum)
  discovery-sound: "UI_TOAST_CHALLENGE_COMPLETE"

# ============================================================
# Black Market System (Faz 0.6.0)
# ============================================================
# A rotating shop where random recipe books appear for purchase.
# The black market refreshes on a timer, offering a random selection
# of recipe books at random prices. Players buy them with PhoenixFish
# balance.
#
# HOW IT WORKS:
# ┌──────────────────────────────────────────────────────┐
# │ Every <refresh-interval> minutes:                    │
# │    → BlackMarketManager picks <stock-count> random   │
# │      recipes from the pool                           │
# │    → Each gets a random price (between min/max)      │
# │    → Stock is saved to blackmarket.yml               │
# │                                                      │
# │ Player: /pcraft blackmarket                          │
# │    → opens the black market GUI                      │
# │    → sees current stock + prices                     │
# │    → clicks to buy (if they can afford it)           │
# │    → gets a recipe book item                         │
# │                                                      │
# │ Next refresh: old stock is replaced with new random  │
# └──────────────────────────────────────────────────────┘
#
# IMPORTANT: Black market requires recipe-sharing to be enabled
# for the purchased books to be useful (otherwise everyone can
# already craft everything).
# ============================================================
blackmarket:
  # ─── Master Switch ───
  # false = black market disabled
  # true  = black market active, refreshes on timer
  enabled: false

  # ─── Refresh Timer ───
  # How often the black market restocks, in minutes.
  # 60 = every hour
  # 1440 = every 24 hours
  # 0 = manual refresh only (admin: /pcraft blackmarket refresh)
  refresh-interval-minutes: 360

  # ─── Stock Count ───
  # How many different recipes appear in each refresh.
  # If there are fewer recipes than this, all are shown.
  stock-count: 5

  # ─── Price Range ───
  # Each recipe gets a random price between min and max.
  # Prices are in PhoenixFish balance.
  min-price: 50
  max-price: 500

  # ─── Recipe Pool ───
  # Which recipes can appear in the black market?
  # ALL = any recipe from PhoenixFish's custom_recipes.yml
  # ROD = only rod-category recipes
  # BAIT = only bait-category recipes
  # Or list specific recipe IDs:
  #   pool:
  #     - cosmic_rod
  #     - legendary_rod
  #     - lunar_moth
  pool: "ALL"

  # ─── Per-Player Purchase Limit ───
  # How many recipes a single player can buy per refresh cycle.
  # 0 = no limit
  # 1 = one recipe per refresh (prevents rich players buying everything)
  purchase-limit-per-refresh: 1

  # ─── Announce Refresh ───
  # Broadcast a message when the black market refreshes.
  announce-refresh: true

# ============================================================
# Stats System (per-player crafting statistics)
# ============================================================
# When enabled, every successful craft is recorded in stats.yml.
# Players can view their stats via /pcraft stats.
stats:
  enabled: true
  # Auto-save interval in seconds. 0 = save only on plugin disable.
  # Higher values reduce disk I/O but risk losing recent stats on crash.
  auto-save-interval-seconds: 60
  # Top-N list size shown in /pcraft stats (server leaderboard)
  leaderboard-top-n: 10

# ============================================================
# Achievements System
# ============================================================
# When enabled, achievements are checked after every successful craft.
# Unlocks are persisted in achievements.yml.
achievements:
  enabled: true
  # Show a title on the player's screen when an achievement is unlocked
  show-title: true
  # Sound played on unlock
  unlock-sound: "UI_TOAST_CHALLENGE_COMPLETE"

  # ============================================================
  # Achievement Definitions
  # ============================================================
  # Each achievement has:
  #   name        — message key in messages_*.yml for display name
  #   description — message key in messages_*.yml for description
  #   type        — one of:
  #                   FIRST_CRAFT     (unlocked on the player's first craft ever)
  #                   TOTAL_CRAFTS    (target = integer, total crafts needed)
  #                   UNIQUE_RECIPES  (target = integer, distinct recipes crafted)
  #                   BULK_CRAFT      (target = integer, single bulk craft of N+ items)
  #                   RECIPE_CRAFTED  (target = recipe id, craft this recipe once)
  #   target      — see type above
  #   reward-commands — list of console commands run on unlock
  #                     use %player% as a placeholder for the player name
  # ============================================================
  list:
    first-craft:
      name: "achievement-first-craft-name"
      description: "achievement-first-craft-desc"
      type: "FIRST_CRAFT"
      target: ""
      reward-commands:
        - "give %player% stick 1"

    apprentice-crafter:
      name: "achievement-apprentice-name"
      description: "achievement-apprentice-desc"
      type: "TOTAL_CRAFTS"
      target: "10"
      reward-commands:
        - "give %player% iron_ingot 5"

    journeyman-crafter:
      name: "achievement-journeyman-name"
      description: "achievement-journeyman-desc"
      type: "TOTAL_CRAFTS"
      target: "50"
      reward-commands:
        - "give %player% gold_ingot 5"

    master-crafter:
      name: "achievement-master-name"
      description: "achievement-master-desc"
      type: "TOTAL_CRAFTS"
      target: "100"
      reward-commands:
        - "give %player% diamond 5"

    legendary-crafter:
      name: "achievement-legendary-name"
      description: "achievement-legendary-desc"
      type: "TOTAL_CRAFTS"
      target: "500"
      reward-commands:
        - "give %player% netherite_ingot 1"

    diverse-crafter:
      name: "achievement-diverse-name"
      description: "achievement-diverse-desc"
      type: "UNIQUE_RECIPES"
      target: "5"
      reward-commands:
        - "give %player% emerald 3"

    bulk-master:
      name: "achievement-bulk-master-name"
      description: "achievement-bulk-master-desc"
      type: "BULK_CRAFT"
      target: "32"
      reward-commands:
        - "give %player% experience_bottle 5"

    first-rod:
      name: "achievement-first-rod-name"
      description: "achievement-first-rod-desc"
      type: "RECIPE_CRAFTED"
      target: "hardwood_rod"
      reward-commands:
        - "give %player% experience_bottle 1"

    cosmic-crafter:
      name: "achievement-cosmic-crafter-name"
      description: "achievement-cosmic-crafter-desc"
      type: "RECIPE_CRAFTED"
      target: "cosmic_rod"
      reward-commands:
        - "give %player% netherite_ingot 2"
        - "effect give %player% minecraft:glowing 30 1"

    legendary-bait-maker:
      name: "achievement-lunar-moth-name"
      description: "achievement-lunar-moth-desc"
      type: "RECIPE_CRAFTED"
      target: "lunar_moth"
      reward-commands:
        - "give %player% phantom_membrane 5"
