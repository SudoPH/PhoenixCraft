# ============================================================
# PhoenixCraft — Recipe Rental strings (Türkçe)
# ============================================================
# Offer / accept / list / cancel / expiry flows.
# MiniMessage tags supported. Placeholders: %recipe% %price% %minutes%
# %player% %owner% %balance% %min% %max%
# ============================================================

rental-usage: "<yellow>Kullanım: /pcraft rent <offer|accept|list|cancel> ..."
rental-disabled: "<red>Tarif kiralama kapalı."
rental-offer-usage: "<yellow>Kullanım: /pcraft rent offer <tarif-id> <fiyat> <dakika>"
