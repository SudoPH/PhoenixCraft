rental-offer-not-learned: "<red>Öğrenmediğin bir tarifi kiraya veremezsin."
rental-offer-too-many: "<red>Çok fazla aktif teklifin var (maks %max%)."
rental-offer-invalid-duration: "<red>Süre %min% ile %max% dakika arasında olmalı."
rental-offer-invalid-price: "<red>Fiyat $%min% ile $%max% arasında olmalı."
rental-accept-usage: "<yellow>Kullanım: /pcraft rent accept <oyuncu> <tarif-id>"
rental-accept-not-found: "<red><yellow>%player%</yellow>'dan <yellow>%recipe%</yellow> için aktif teklif yok."
rental-accept-insufficient-funds: "<red>Yetersiz bakiye! Gerekli: <yellow>$%price%</yellow>, Mevcut: $%balance%"
rental-accept-too-many: "<red>Çok fazla aktif kiralaman var (maks %max%)."
