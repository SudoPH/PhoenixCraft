rental-accept-owner-notify: "<green>✔ <yellow>%player%</yellow> <white>%recipe%</white> tarifini <gold>$%price%</gold>'a kiraladı."
rental-list-header: "<gold><bold>Aktif Kiralama Teklifleri"
rental-list-line: "<yellow>%player% <gray>— <white>%recipe% <dark_gray>| <gold>$%price% <dark_gray>| <yellow>%minutes%dk"
rental-list-empty: "<gray>Aktif kiralama teklifi yok."
rental-cancel-usage: "<yellow>Kullanım: /pcraft rent cancel <tarif-id>"
rental-cancel-success: "<green>✔ <white>%recipe%</white> için kiralama teklifi iptal edildi."
rental-cancel-not-found: "<red><yellow>%recipe%</yellow> için aktif teklifin yok."
rental-expired: "<red><white>%recipe%</white> kiralamanın süresi doldu."
rental-fee-charged: "<dark_gray>İşlem ücreti: <red>-$%fee%"
rental-list-title: "<dark_gray>» <gold>Kiralama Teklifleri"
rental-my-rentals-title: "<dark_gray>» <gold>Aktif Kiralamalarım"
