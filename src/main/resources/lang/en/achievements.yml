achievement-unlocked-lore-2: ""
achievement-unlocked-lore-3: "<green>✔ Unlocked"
achievements-empty: "<gray>No achievements defined in config.yml."
achievements-disabled-name: "<red><bold>Achievements Disabled"
achievements-disabled-lore: "<gray>The achievements system is disabled in config.yml."
achievements-disabled-message: "<red>The achievements system is disabled."
achievement-unlocked: "<gold><bold>★ Achievement Unlocked!</bold></gold> <white>%achievement%</white> <dark_gray>— <gray>%description%"
