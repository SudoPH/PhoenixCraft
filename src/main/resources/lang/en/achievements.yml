# ============================================================
# PhoenixCraft — Achievement strings (English)
# ============================================================
# Covers achievement unlock notifications, GUI tier labels,
# progress lines, and per-achievement name/description keys.
# MiniMessage tags supported. Placeholders: %achievement%
# %description% %tier% %current% %target% %rank% %player% %count% %n%
# ============================================================

achievements-title: "<dark_gray>» <gold>Achievements <dark_gray>(<white>%unlocked%/%total%</white>)"
achievements-progress: "<gray>Progress: <yellow>%unlocked%<dark_gray>/<white>%total%"
achievement-locked-name: "<gray><italic>%name%"
