# ============================================================
# PhoenixCraft — Crafting GUI strings (English)
# ============================================================
# MiniMessage tags supported: <red>, <green>, <yellow>, <gold>,
# <gray>, <dark_gray>, <bold>, <italic>, <gradient:#hex1:#hex2>,
# <rainbow>, <lang:translation.key>.
#
# Placeholders: %recipe% %recipe_id% %item% %xp% %count% %owned%
# %needed% %level% %required% %current% %page% %total% %category%
# %fee% %balance% %price% %mode% %color% %time% %seconds%
# %min% %max% %minutes% %hours% %query% %reason%
#
# Lines using %color% MUST be fetched via LangManager.getRaw(...)
# to avoid MiniMessage-escape corruption of the color tag.
# ============================================================

